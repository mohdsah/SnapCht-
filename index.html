<script>
    // ==================== SUPABASE CONFIG ====================
    const SUPABASE_URL = 'https://xliywedqcpavytvmlqib.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhsaXl3ZWRxY3Bhdnl0dm1scWliIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NTE0OTUsImV4cCI6MjA5NjQyNzQ5NX0.YJ4doL1vTXcVWX5M0n3tpS5gbO5HB4S0d5V_1i4_LsM';
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // ==================== STATE ====================
    let currentUser = null;
    let currentObserver = null;
    let allVideos = [];
    let currentFeedType = 'foryou';
    let unreadMessages = 0;
    let currentChatUser = null;
    
    // ==================== HELPER FUNCTIONS ====================
    function showToast(msg) {
        let existing = document.querySelector('.toast-message');
        if(existing) existing.remove();
        let toast = document.createElement('div');
        toast.className = 'toast-message';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 2000);
    }
    
    function formatLikes(likes) {
        if (likes >= 1000000) return (likes / 1000000).toFixed(1) + 'M';
        if (likes >= 1000) return (likes / 1000).toFixed(1) + 'K';
        return likes.toString();
    }
    
    function hideLoading() {
        const loadingScreen = document.getElementById('loadingScreen');
        if(loadingScreen) loadingScreen.style.display = 'none';
    }
    
    function escapeHtml(str) {
        if(!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }
    
    // ==================== AUTH INIT ====================
    async function initAuth() {
        const { data: { session } } = await supabase.auth.getSession();
        
        if(session) {
            currentUser = session.user;
            await Promise.all([
                loadSuggestedAccounts(),
                loadMessages(),
                loadVideos('foryou')
            ]);
            hideLoading();
        } else {
            const { data, error } = await supabase.auth.signUp({
                email: `user_${Date.now()}@snapcht.com`,
                password: Math.random().toString(36).slice(-12)
            });
            
            if(error) {
                showToast('Connection error. Please refresh.');
                return;
            }
            currentUser = data.user;
            await Promise.all([
                loadSuggestedAccounts(),
                loadMessages(),
                loadVideos('foryou')
            ]);
            hideLoading();
        }
    }
    
    // ==================== LOAD VIDEOS ====================
    async function loadVideos(type) {
        currentFeedType = type;
        let query = supabase.from('videos').select('*');
        
        if(type === 'trending') {
            query = query.order('likes', { ascending: false }).limit(20);
        } else {
            query = query.order('created_at', { ascending: false });
        }
        
        const { data, error } = await query;
        
        if(error) {
            console.error('Error loading videos:', error);
            if(error.message.includes('relation') || error.code === '42P01') {
                await createTablesAndInsertSamples();
                await loadVideos(type);
            }
            return;
        }
        
        allVideos = data || [];
        renderFeed();
    }
    
    async function createTablesAndInsertSamples() {
        showToast('Setting up database...');
        
        // Insert sample videos directly (table will be created automatically by Supabase when inserting)
        const sampleVideos = [
            { title: "🔥 SnapCht Beta", description: "UI SnapCht beta dah live! Jom explore #SnapCht", video_url: "https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-sign-light-looking-at-phone-42023-large.mp4", likes: 12600, user_id: currentUser?.id, username: currentUser?.email?.split('@')[0] || 'creator' },
            { title: "Alam Semulajadi", description: "Keindahan alam yang menenangkan jiwa 🍃", video_url: "https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-flowers-falling-down-48744-large.mp4", likes: 9500, user_id: currentUser?.id, username: currentUser?.email?.split('@')[0] || 'creator' },
            { title: "Coding Sprint", description: "Coding untuk SnapCht 2.0 ✨ #devlife", video_url: "https://assets.mixkit.co/videos/preview/mixkit-man-working-on-laptop-at-the-office-39846-large.mp4", likes: 5200, user_id: currentUser?.id, username: currentUser?.email?.split('@')[0] || 'creator' },
            { title: "Sunset Vibes", description: "Keindahan senja di pantai 🌅", video_url: "https://assets.mixkit.co/videos/preview/mixkit-beautiful-sunset-over-the-ocean-47186-large.mp4", likes: 18700, user_id: currentUser?.id, username: currentUser?.email?.split('@')[0] || 'creator' },
            { title: "Music Session", description: "New music alert! 🎸", video_url: "https://assets.mixkit.co/videos/preview/mixkit-young-woman-playing-guitar-on-a-balcony-47416-large.mp4", likes: 34200, user_id: currentUser?.id, username: currentUser?.email?.split('@')[0] || 'creator' }
        ];
        
        for(const video of sampleVideos) {
            try {
                await supabase.from('videos').insert(video);
            } catch(e) {}
        }
    }
    
    // ==================== RENDER FEED ====================
    const feedContainer = document.getElementById('videoFeed');
    
    function renderFeed() {
        if(!allVideos.length) {
            feedContainer.innerHTML = '<div class="empty-state">📹 Tiada video. Klik + untuk upload!</div>';
            return;
        }
        
        feedContainer.innerHTML = allVideos.map(video => `
            <div class="video-wrapper" data-id="${video.id}">
                <div class="video-card">
                    <video class="main-video-player" loop muted playsinline preload="metadata">
                        <source src="${escapeHtml(video.video_url)}" type="video/mp4">
                    </video>
                    <div class="video-progress"><div class="progress-fill"></div></div>
                    <div class="interaction-bar">
                        <div class="interact-btn" data-action="profile" data-username="${escapeHtml(video.username)}">
                            <div class="circle-icon">👤<div class="profile-badge">+</div></div>
                        </div>
                        <div class="interact-btn like-btn" data-id="${video.id}" data-likes="${video.likes}">
                            <div class="circle-icon">❤️</div>
                            <span class="like-count">${formatLikes(video.likes)}</span>
                        </div>
                        <div class="interact-btn" data-action="comment">
                            <div class="circle-icon">💬</div>
                            <span>0</span>
                        </div>
                        <div class="interact-btn" data-action="share">
                            <div class="circle-icon">🔗</div>
                            <span>Share</span>
                        </div>
                    </div>
                    <div class="video-details-box">
                        <span class="username" data-username="${escapeHtml(video.username)}">@${escapeHtml(video.username)}</span>
                        <p class="description">${escapeHtml(video.description || video.title || 'Tiada kapsyen')}</p>
                        <div class="music-track">🎵 original sound - ${escapeHtml(video.username)}</div>
                    </div>
                </div>
            </div>
        `).join('');
        
        initVideoPlayers();
        attachEventListeners();
    }
    
    function initVideoPlayers() {
        const videos = document.querySelectorAll('.main-video-player');
        
        if(currentObserver) currentObserver.disconnect();
        
        videos.forEach(video => {
            const progressFill = video.closest('.video-card')?.querySelector('.progress-fill');
            if(progressFill) {
                video.addEventListener('timeupdate', () => {
                    if(video.duration) progressFill.style.width = (video.currentTime / video.duration) * 100 + '%';
                });
                video.addEventListener('ended', () => {
                    progressFill.style.width = '0%';
                    video.currentTime = 0;
                    video.play().catch(()=>{});
                });
            }
            
            video.addEventListener('click', (e) => {
                e.stopPropagation();
                if(video.paused) {
                    video.muted = false;
                    video.play().catch(()=>{});
                    showToast("▶️ Dimainkan");
                } else {
                    video.pause();
                    showToast("⏸ Dijeda");
                }
            });
            
            video.addEventListener('dblclick', (e) => {
                e.stopPropagation();
                const likeBtn = video.closest('.video-wrapper')?.querySelector('.like-btn');
                if(likeBtn) likeBtn.click();
            });
        });
        
        const observerOptions = { root: feedContainer, threshold: 0.6 };
        currentObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const vid = entry.target;
                if(entry.isIntersecting) {
                    vid.play().catch(()=>{});
                } else {
                    vid.pause();
                }
            });
        }, observerOptions);
        
        videos.forEach(video => currentObserver.observe(video));
        setTimeout(() => { if(videos[0]) videos[0].play().catch(()=>{}); }, 500);
    }
    
    // ==================== LIKE VIDEO ====================
    async function likeVideo(videoId, currentLikes, btn, countSpan, iconCircle) {
        const newLikes = currentLikes + 1;
        
        countSpan.innerText = formatLikes(newLikes);
        btn.setAttribute('data-likes', newLikes);
        iconCircle.style.transform = 'scale(1.2)';
        iconCircle.classList.add('liked');
        setTimeout(() => {
            iconCircle.style.transform = '';
            setTimeout(() => iconCircle.classList.remove('liked'), 300);
        }, 200);
        
        const { error } = await supabase
            .from('videos')
            .update({ likes: newLikes })
            .eq('id', videoId);
        
        if(error) {
            countSpan.innerText = formatLikes(currentLikes);
            btn.setAttribute('data-likes', currentLikes);
            showToast('Gagal like. Cuba lagi.');
        } else {
            const videoIndex = allVideos.findIndex(v => v.id === videoId);
            if(videoIndex !== -1) allVideos[videoIndex].likes = newLikes;
            showToast('❤️ Disukai!');
        }
    }
    
    // ==================== UPLOAD VIDEO ====================
    async function uploadVideoToSupabase(file, caption) {
        const fileName = `${Date.now()}_${file.name}`;
        const { data, error } = await supabase.storage
            .from('videos')
            .upload(fileName, file);
        
        if(error) throw error;
        
        const { data: { publicUrl } } = supabase.storage
            .from('videos')
            .getPublicUrl(fileName);
        
        const { error: insertError } = await supabase
            .from('videos')
            .insert({
                title: caption.substring(0, 100),
                description: caption,
                video_url: publicUrl,
                likes: 0,
                user_id: currentUser.id,
                username: currentUser.email?.split('@')[0] || 'pengguna'
            });
        
        if(insertError) throw insertError;
        
        await loadVideos(currentFeedType);
    }
    
    function showUploadModal() {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.id = 'uploadModal';
        modal.innerHTML = `
            <div class="modal-content">
                <div class="modal-header"><h3>🎥 Muat Naik Video</h3><button class="close-modal" onclick="closeModal('uploadModal')">✕</button></div>
                <input type="file" id="videoFileInput" accept="video/*" class="modal-input">
                <input type="text" id="videoCaption" placeholder="Kapsyen..." class="modal-input">
                <button class="btn-primary" id="uploadBtn">Upload</button>
            </div>
        `;
        document.body.appendChild(modal);
        
        document.getElementById('uploadBtn').onclick = async () => {
            const fileInput = document.getElementById('videoFileInput');
            const caption = document.getElementById('videoCaption').value || "Tiada kapsyen";
            if(!fileInput.files[0]) { showToast('📁 Pilih video terlebih dahulu'); return; }
            const file = fileInput.files[0];
            if(file.size > 20 * 1024 * 1024) { showToast('❌ Video terlalu besar! Maksimum 20MB'); return; }
            
            showToast('📤 Sedang upload...');
            modal.querySelector('#uploadBtn').disabled = true;
            
            try {
                await uploadVideoToSupabase(file, caption);
                showToast('✅ Video berjaya dimuat naik!');
                closeModal('uploadModal');
            } catch(err) {
                console.error(err);
                showToast('❌ Gagal upload. Cuba lagi.');
                modal.querySelector('#uploadBtn').disabled = false;
            }
        };
    }
    
    // ==================== MY VIDEOS ====================
    async function loadMyVideos() {
        const { data, error } = await supabase
            .from('videos')
            .select('*')
            .eq('user_id', currentUser.id)
            .order('created_at', { ascending: false });
        
        if(error) {
            showToast('Error loading your videos');
            return;
        }
        
        allVideos = data || [];
        renderFeed();
    }
    
    // ==================== SUGGESTED ACCOUNTS ====================
    async function loadSuggestedAccounts() {
        const { data, error } = await supabase
            .from('videos')
            .select('username')
            .neq('user_id', currentUser?.id)
            .limit(5);
        
        if(error) return;
        
        const uniqueUsers = [...new Map(data.map(u => [u.username, u])).values()];
        const container = document.getElementById('suggestedAccounts');
        if(container) {
            container.innerHTML = uniqueUsers.map(user => `
                <div class="account-item" data-username="${escapeHtml(user.username)}">
                    <div class="avatar-box">👤</div>
                    <div class="account-name">${escapeHtml(user.username)}</div>
                </div>
            `).join('') || '<p style="color:#777; padding:10px;">Tiada akaun lain</p>';
            
            document.querySelectorAll('.account-item').forEach(acc => {
                acc.addEventListener('click', () => {
                    const username = acc.getAttribute('data-username');
                    showToast(`👤 Profil ${username}`);
                    showInbox();
                    setTimeout(() => openChat(username), 100);
                });
            });
        }
    }
    
    // ==================== INBOX & MESSAGES ====================
    async function loadMessages() {
        const { data, error } = await supabase
            .from('messages')
            .select('*')
            .or(`from_user.eq.${currentUser.id},to_user.eq.${currentUser.id}`);
        
        if(error) {
            if(error.code === '42P01') {
                await createMessagesTable();
            }
            return;
        }
        
        const unread = data.filter(m => m.to_user === currentUser.id && !m.read).length;
        unreadMessages = unread;
        updateInboxBadge();
    }
    
    async function createMessagesTable() {
        // Messages will be created when first message is sent
    }
    
    function updateInboxBadge() {
        const inboxNav = document.querySelector('[data-mnav="inbox"]');
        if(inboxNav && unreadMessages > 0) {
            let badge = inboxNav.querySelector('.notification-badge');
            if(!badge) {
                badge = document.createElement('span');
                badge.className = 'notification-badge';
                inboxNav.appendChild(badge);
            }
            badge.textContent = unreadMessages > 9 ? '9+' : unreadMessages;
        }
    }
    
    async function sendMessage(toUsername, text) {
        const { data: userData } = await supabase
            .from('videos')
            .select('user_id')
            .eq('username', toUsername)
            .limit(1);
        
        const toUserId = userData?.[0]?.user_id;
        if(!toUserId) return;
        
        const { error } = await supabase
            .from('messages')
            .insert({
                from_user: currentUser.id,
                to_user: toUserId,
                message: text,
                read: false
            });
        
        if(error) {
            showToast('Gagal hantar mesej');
        } else {
            showToast('💌 Mesej dihantar');
            await loadMessages();
        }
    }
    
    function showInbox() {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.id = 'inboxModal';
        modal.innerHTML = `
            <div class="modal-content" style="max-width:450px; height:80vh; display:flex; flex-direction:column;">
                <div class="modal-header"><h3>💬 Mesej</h3><button class="close-modal" onclick="closeModal('inboxModal')">✕</button></div>
                <div id="chatListView" style="flex:1; overflow-y:auto;">
                    <p style="color:#777; text-align:center; padding:20px;">Klik pada akaun di sidebar untuk mulakan chat</p>
                </div>
                <div id="chatView" style="display:none; flex:1; flex-direction:column;">
                    <div style="display:flex; gap:12px; align-items:center; margin-bottom:12px;">
                        <button onclick="backToChatList()" style="background:#333; border:none; padding:8px 16px; border-radius:20px; color:white; cursor:pointer;">← Kembali</button>
                        <span id="chatWithUser" style="font-weight:bold;"></span>
                    </div>
                    <div id="chatMessages" class="chat-messages"></div>
                    <div class="chat-input-area">
                        <input type="text" id="messageInput" class="chat-input" placeholder="Taip mesej...">
                        <button onclick="sendChatMessage()" style="background:#fe2c55; border:none; padding:12px 20px; border-radius:24px; color:white; cursor:pointer;">Hantar</button>
                    </div>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
    }
    
    window.openChat = async function(username) {
        currentChatUser = username;
        const chatListView = document.getElementById('chatListView');
        const chatView = document.getElementById('chatView');
        if(chatListView) chatListView.style.display = 'none';
        if(chatView) chatView.style.display = 'flex';
        const chatWithUserSpan = document.getElementById('chatWithUser');
        if(chatWithUserSpan) chatWithUserSpan.innerText = username;
        await loadChatMessages();
    };
    
    window.backToChatList = function() {
        const chatView = document.getElementById('chatView');
        const chatListView = document.getElementById('chatListView');
        if(chatView) chatView.style.display = 'none';
        if(chatListView) chatListView.style.display = 'block';
    };
    
    async function loadChatMessages() {
        const { data: userData } = await supabase
            .from('videos')
            .select('user_id')
            .eq('username', currentChatUser)
            .limit(1);
        
        const otherUserId = userData?.[0]?.user_id;
        if(!otherUserId) return;
        
        const { data, error } = await supabase
            .from('messages')
            .select('*')
            .or(`and(from_user.eq.${currentUser.id},to_user.eq.${otherUserId}),and(from_user.eq.${otherUserId},to_user.eq.${currentUser.id})`)
            .order('created_at', { ascending: true });
        
        if(error) return;
        
        const container = document.getElementById('chatMessages');
        if(container) {
            container.innerHTML = data.map(msg => `
                <div class="message-bubble ${msg.from_user === currentUser.id ? 'sent' : 'received'}">
                    <div class="message-sender">${msg.from_user === currentUser.id ? 'Anda' : currentChatUser}</div>
                    <div class="message-text">${escapeHtml(msg.message)}</div>
                    <div style="font-size:0.6rem; opacity:0.5; margin-top:2px;">${new Date(msg.created_at).toLocaleTimeString()}</div>
                </div>
            `).join('');
            container.scrollTop = container.scrollHeight;
        }
        
        await supabase
            .from('messages')
            .update({ read: true })
            .eq('to_user', currentUser.id)
            .eq('from_user', otherUserId);
        
        await loadMessages();
    }
    
    window.sendChatMessage = async function() {
        const input = document.getElementById('messageInput');
        const text = input.value.trim();
        if(!text) return;
        
        await sendMessage(currentChatUser, text);
        input.value = '';
        await loadChatMessages();
    };
    
    // ==================== PROFILE ====================
    function showProfile() {
        const modal = document.createElement('div');
        modal.className = 'modal-overlay';
        modal.id = 'profileModal';
        modal.innerHTML = `
            <div class="modal-content">
                <div class="modal-header"><h3>👤 Profil</h3><button class="close-modal" onclick="closeModal('profileModal')">✕</button></div>
                <div style="text-align:center;">
                    <div style="font-size:64px; margin-bottom:12px;">👤</div>
                    <p><strong>${escapeHtml(currentUser?.email?.split('@')[0] || 'Pengguna')}</strong></p>
                    <p style="color:#777; font-size:0.8rem;">ID: ${currentUser?.id?.substring(0, 8)}...</p>
                    <button class="btn-secondary" onclick="closeModal('profileModal')" style="margin-top:16px;">Tutup</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
    }
    
    // ==================== EVENT LISTENERS ====================
    function attachEventListeners() {
        document.querySelectorAll('.like-btn').forEach(btn => {
            let liked = false;
            const countSpan = btn.querySelector('.like-count');
            const iconCircle = btn.querySelector('.circle-icon');
            
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                if(!liked) {
                    const videoId = btn.getAttribute('data-id');
                    const currentLikes = parseInt(btn.getAttribute('data-likes')) || 0;
                    await likeVideo(videoId, currentLikes, btn, countSpan, iconCircle);
                    liked = true;
                } else {
                    showToast('Anda sudah suka video ini');
                }
            });
        });
        
        document.querySelectorAll('.interact-btn[data-action="share"]').forEach(btn => {
            btn.addEventListener('click', (e) => {
                e.stopPropagation();
                showToast('🔗 Pautan disalin');
                navigator.clipboard?.writeText(window.location.href);
            });
        });
        
        document.querySelectorAll('.interact-btn[data-action="comment"], .interact-btn[data-action="profile"], .username').forEach(el => {
            el.addEventListener('click', (e) => {
                e.stopPropagation();
                showToast('✨ Feature akan datang!');
            });
        });
        
        document.querySelectorAll('.top-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.top-tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                const type = tab.getAttribute('data-tab');
                if(type === 'trending') {
                    loadVideos('trending');
                } else {
                    loadVideos('foryou');
                }
            });
        });
        
        document.querySelectorAll('.menu-item').forEach(item => {
            item.addEventListener('click', () => {
                document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
                item.classList.add('active');
                const nav = item.getAttribute('data-nav');
                if(nav === 'myvideos') loadMyVideos();
                else if(nav === 'trending') loadVideos('trending');
                else loadVideos('foryou');
            });
        });
        
        document.getElementById('searchBtn')?.addEventListener('click', () => showToast('🔍 Fungsi carian akan tiba'));
        
        document.querySelectorAll('[data-mnav]').forEach(nav => {
            nav.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('[data-mnav]').forEach(n => n.classList.remove('active'));
                nav.classList.add('active');
                const action = nav.getAttribute('data-mnav');
                if(action === 'create') showUploadModal();
                else if(action === 'profile') showProfile();
                else if(action === 'inbox') showInbox();
                else if(action === 'trending') loadVideos('trending');
                else loadVideos('foryou');
            });
        });
    }
    
    // ==================== INIT ====================
    window.closeModal = function(modalId) {
        const modal = document.getElementById(modalId);
        if(modal) modal.remove();
    };
    
    initAuth();
</script>
</body>
</html>
