<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>SnapCht V3.1</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --primary:#fe2c55;--primary-dark:#c9002c;
  --bg:#000;--surface:#111;--surface2:#1a1a1a;
  --text:#fff;--text2:#aaa;--text3:#666;
  --border:#222;--radius:12px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bot:env(safe-area-inset-bottom,0px);
}
html,body{width:100%;height:100%;background:var(--bg);overflow:hidden;touch-action:none}
#app{width:100%;height:100%;display:flex;flex-direction:column;background:var(--bg)}

/* ── FEED ─────────────────────────────────────────────────────────────────── */
#feed{flex:1;overflow-y:scroll;scroll-snap-type:y mandatory;scrollbar-width:none;padding-top:var(--safe-top)}
#feed::-webkit-scrollbar{display:none}
.video-item{
  position:relative;width:100%;height:calc(100svh - 60px - var(--safe-top));
  scroll-snap-align:start;scroll-snap-stop:always;overflow:hidden;background:#000;
}
video{width:100%;height:100%;object-fit:cover;display:block}

/* ── ACTIONS sidebar ──────────────────────────────────────────────────────── */
.actions{
  position:absolute;right:10px;bottom:100px;
  display:flex;flex-direction:column;align-items:center;gap:18px;z-index:10;
}
.action-btn{
  display:flex;flex-direction:column;align-items:center;gap:4px;
  cursor:pointer;user-select:none;-webkit-user-select:none;
}
.action-icon{
  width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,0.12);
  backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;
  font-size:22px;transition:transform .15s;
}
.action-btn:active .action-icon{transform:scale(.85)}
.action-count{color:#fff;font-size:12px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.action-icon.liked{background:rgba(254,44,85,.25)}
.action-icon.saved{background:rgba(255,215,0,.2)}

/* mute button */
.mute-btn{
  position:absolute;top:60px;right:12px;z-index:10;
  width:36px;height:36px;border-radius:50%;
  background:rgba(0,0,0,.55);backdrop-filter:blur(4px);
  display:flex;align-items:center;justify-content:center;
  font-size:17px;cursor:pointer;border:none;color:#fff;
}

/* ── VIDEO INFO ───────────────────────────────────────────────────────────── */
.video-info{
  position:absolute;left:12px;bottom:100px;right:70px;z-index:10;
}
.video-username{
  display:flex;align-items:center;gap:8px;margin-bottom:6px;
}
.username-text{font-weight:700;font-size:15px;color:#fff}
.follow-chip{
  background:var(--primary);color:#fff;
  font-size:11px;font-weight:700;padding:3px 8px;border-radius:10px;
  border:none;cursor:pointer;white-space:nowrap;
}
.follow-chip.following{background:transparent;border:1px solid #fff;color:#fff}
.video-desc{font-size:13px;color:#fff;line-height:1.5;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.video-hashtags{font-size:13px;color:#fff;font-weight:600;margin-top:4px}

/* ── PROGRESS BAR ─────────────────────────────────────────────────────────── */
.progress-bar{position:absolute;bottom:0;left:0;right:0;height:3px;background:rgba(255,255,255,.2);z-index:10}
.progress-fill{height:100%;background:var(--primary);width:0%;transition:width .3s linear}

/* ── DOUBLE TAP LIKE ──────────────────────────────────────────────────────── */
.double-tap-area{position:absolute;inset:0;z-index:5}
.heart-anim{
  position:absolute;pointer-events:none;font-size:80px;z-index:20;
  animation:heartPop .8s ease-out forwards;transform-origin:center;
}
@keyframes heartPop{
  0%  {transform:scale(0) rotate(-15deg);opacity:.9}
  40% {transform:scale(1.3) rotate(5deg);opacity:1}
  70% {transform:scale(1.1);opacity:.9}
  100%{transform:scale(1.2) translateY(-20px);opacity:0}
}

/* ── HEADER ───────────────────────────────────────────────────────────────── */
#header{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:calc(var(--safe-top) + 8px) 16px 10px;
  display:flex;align-items:center;justify-content:space-between;
  background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent);
  pointer-events:none;
}
#header>*{pointer-events:all}
.logo{font-size:20px;font-weight:900;color:#fff;letter-spacing:-.5px}
.logo span{color:var(--primary)}
.header-right{display:flex;align-items:center;gap:10px}
.header-btn{
  width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.1);
  backdrop-filter:blur(4px);border:none;color:#fff;font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;
}
.notif-dot{
  position:absolute;top:4px;right:4px;width:8px;height:8px;
  border-radius:50%;background:var(--primary);border:2px solid #000;
  display:none;animation:pulse 1.5s ease-in-out infinite;
}
.notif-dot.show{display:block}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}

/* ── TABS ─────────────────────────────────────────────────────────────────── */
.tabs{display:flex;gap:4px;background:rgba(0,0,0,.3);border-radius:20px;padding:3px}
.tab-btn{
  padding:5px 14px;border-radius:16px;font-size:13px;font-weight:600;
  border:none;background:transparent;color:rgba(255,255,255,.6);cursor:pointer;
  transition:all .2s;
}
.tab-btn.active{background:rgba(255,255,255,.15);color:#fff}

/* ── BOTTOM NAV ───────────────────────────────────────────────────────────── */
#nav{
  height:calc(60px + var(--safe-bot));padding-bottom:var(--safe-bot);
  display:flex;align-items:center;justify-content:space-around;
  background:var(--bg);border-top:1px solid var(--border);
  position:fixed;bottom:0;left:0;right:0;z-index:100;
}
.nav-item{
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;padding:6px 0;
}
.nav-icon{font-size:24px;transition:transform .15s}
.nav-item:active .nav-icon{transform:scale(.85)}
.nav-label{font-size:10px;font-weight:600;color:var(--text3)}
.nav-item.active .nav-icon{filter:drop-shadow(0 0 4px var(--primary))}
.nav-item.active .nav-label{color:var(--primary)}
.post-btn{
  width:46px;height:32px;background:var(--primary);border:none;border-radius:8px;
  color:#fff;font-size:22px;cursor:pointer;display:flex;align-items:center;
  justify-content:center;box-shadow:0 2px 8px rgba(254,44,85,.4);
}

/* ── PANEL ────────────────────────────────────────────────────────────────── */
.panel{
  position:fixed;inset:0;z-index:200;
  background:rgba(0,0,0,.6);backdrop-filter:blur(4px);
  display:none;align-items:flex-end;justify-content:center;
}
.panel.show{display:flex}
.panel-box{
  width:100%;max-width:540px;background:var(--surface);
  border-radius:20px 20px 0 0;max-height:90svh;overflow:hidden;
  display:flex;flex-direction:column;
  padding-bottom:calc(16px + var(--safe-bot));
}
.panel-handle{width:40px;height:4px;background:#444;border-radius:2px;margin:10px auto 0}
.panel-title{font-size:16px;font-weight:700;color:var(--text);
  text-align:center;padding:12px 16px 8px}

/* ── COMMENTS ─────────────────────────────────────────────────────────────── */
.comments-list{flex:1;overflow-y:auto;padding:0 16px;scrollbar-width:none}
.comments-list::-webkit-scrollbar{display:none}
.comment-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--border)}
.comment-avatar{width:36px;height:36px;border-radius:50%;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.comment-body{flex:1}
.comment-user{font-weight:700;font-size:13px;color:var(--text)}
.comment-text{font-size:13px;color:var(--text2);margin-top:2px;line-height:1.4}
.comment-time{font-size:11px;color:var(--text3);margin-top:4px}
.comment-likes{display:flex;align-items:center;gap:4px;margin-top:4px;cursor:pointer}
.comment-likes span{font-size:11px;color:var(--text3)}

.comment-input-row{
  display:flex;gap:10px;padding:12px 16px 0;align-items:center;
  border-top:1px solid var(--border);
}
.comment-input{
  flex:1;background:var(--surface2);border:none;border-radius:20px;
  padding:10px 14px;color:var(--text);font-size:14px;outline:none;
}
.comment-input::placeholder{color:var(--text3)}
.comment-send{
  width:38px;height:38px;border-radius:50%;background:var(--primary);
  border:none;color:#fff;font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}

/* ── PROFILE PANEL ────────────────────────────────────────────────────────── */
.profile-header{
  padding:20px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;
}
.profile-avatar{
  width:72px;height:72px;border-radius:50%;
  background:linear-gradient(135deg,var(--primary),#ff9a00);
  display:flex;align-items:center;justify-content:center;font-size:36px;
  border:3px solid var(--surface2);
}
.profile-name{font-size:18px;font-weight:800;color:var(--text)}
.profile-bio{font-size:13px;color:var(--text2);text-align:center;line-height:1.4}
.profile-stats{display:flex;gap:24px;justify-content:center;margin-top:4px}
.stat-item{text-align:center}
.stat-num{font-size:18px;font-weight:800;color:var(--text)}
.stat-label{font-size:11px;color:var(--text3);margin-top:1px}
.profile-edit-btn{
  padding:8px 28px;border-radius:8px;background:var(--surface2);
  border:1px solid var(--border);color:var(--text);font-size:14px;
  font-weight:600;cursor:pointer;width:100%;max-width:240px;
}
.profile-tabs{display:flex;border-bottom:1px solid var(--border)}
.profile-tab{
  flex:1;padding:12px;text-align:center;font-size:20px;cursor:pointer;
  border-bottom:2px solid transparent;transition:border .2s;
}
.profile-tab.active{border-bottom-color:var(--primary)}
.profile-grid{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;
  overflow-y:auto;flex:1;scrollbar-width:none;
}
.profile-grid::-webkit-scrollbar{display:none}
.profile-thumb{
  aspect-ratio:9/16;background:var(--surface2);position:relative;cursor:pointer;
  overflow:hidden;
}
.profile-thumb img,.profile-thumb video{width:100%;height:100%;object-fit:cover}
.thumb-likes{
  position:absolute;bottom:4px;left:4px;
  display:flex;align-items:center;gap:3px;
  font-size:11px;color:#fff;font-weight:600;
  text-shadow:0 1px 2px rgba(0,0,0,.6);
}

/* ── NOTIFICATIONS ────────────────────────────────────────────────────────── */
.notif-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;
}
.notif-item.unread{background:rgba(254,44,85,.06)}
.notif-avatar{
  width:40px;height:40px;border-radius:50%;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;
}
.notif-text{flex:1;font-size:13px;color:var(--text2);line-height:1.4}
.notif-text strong{color:var(--text)}
.notif-time{font-size:11px;color:var(--text3);flex-shrink:0}
.notif-thumb{
  width:40px;height:50px;border-radius:6px;
  background:var(--surface2);object-fit:cover;flex-shrink:0;
}
.empty-state{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:48px 24px;gap:12px;
}
.empty-icon{font-size:48px;opacity:.4}
.empty-text{font-size:14px;color:var(--text3);text-align:center}

/* ── SEARCH ───────────────────────────────────────────────────────────────── */
.search-container{padding:12px 16px;background:var(--bg);
  position:sticky;top:0;z-index:10}
.search-input-wrap{position:relative}
.search-input{
  width:100%;background:var(--surface);border:none;border-radius:10px;
  padding:10px 14px 10px 38px;color:var(--text);font-size:14px;outline:none;
}
.search-input::placeholder{color:var(--text3)}
.search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);
  font-size:18px;opacity:.5}
.hashtag-chips{display:flex;gap:8px;overflow-x:auto;padding:8px 16px;
  scrollbar-width:none}
.hashtag-chips::-webkit-scrollbar{display:none}
.hashtag-chip{
  white-space:nowrap;padding:6px 14px;background:var(--surface);
  border-radius:20px;font-size:13px;color:var(--text);cursor:pointer;
  border:1px solid var(--border);transition:all .2s;
}
.hashtag-chip:active{background:var(--primary);border-color:var(--primary)}
.search-results{overflow-y:auto;flex:1;scrollbar-width:none}
.search-results::-webkit-scrollbar{display:none}
.search-video-item{
  display:flex;gap:12px;padding:10px 16px;cursor:pointer;
  border-bottom:1px solid var(--border);
}
.search-thumb{
  width:60px;height:75px;border-radius:8px;
  background:var(--surface);object-fit:cover;flex-shrink:0;
}
.search-info{flex:1}
.search-title{font-size:14px;color:var(--text);font-weight:600;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.search-meta{font-size:12px;color:var(--text3);margin-top:4px}

/* ── UPLOAD ───────────────────────────────────────────────────────────────── */
.upload-box{padding:20px 16px;display:flex;flex-direction:column;gap:16px}
.input-field{
  width:100%;background:var(--surface2);border:1px solid var(--border);
  border-radius:10px;padding:12px 14px;color:var(--text);font-size:14px;
  outline:none;font-family:inherit;resize:none;
}
.input-field::placeholder{color:var(--text3)}
.input-label{font-size:13px;color:var(--text3);margin-bottom:4px;display:block}
.url-preview{
  width:100%;border-radius:10px;background:var(--surface2);
  overflow:hidden;display:none;
}
.url-preview video{width:100%;max-height:200px;object-fit:contain}
.submit-btn{
  width:100%;padding:14px;background:var(--primary);border:none;
  border-radius:10px;color:#fff;font-size:16px;font-weight:700;
  cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;
}
.submit-btn:disabled{opacity:.5;cursor:not-allowed}

/* ── SHARE MENU ───────────────────────────────────────────────────────────── */
.share-grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:16px;
}
.share-item{
  display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;
}
.share-icon{
  width:48px;height:48px;border-radius:12px;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:22px;
}
.share-label{font-size:11px;color:var(--text2)}

/* ── CHAT ─────────────────────────────────────────────────────────────────── */
.chat-list{overflow-y:auto;flex:1;scrollbar-width:none}
.chat-list::-webkit-scrollbar{display:none}
.chat-item{
  display:flex;gap:12px;padding:12px 16px;
  border-bottom:1px solid var(--border);cursor:pointer;
}
.chat-avatar{
  width:44px;height:44px;border-radius:50%;background:var(--surface2);
  display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;
}
.chat-info{flex:1}
.chat-name{font-size:14px;font-weight:700;color:var(--text)}
.chat-preview{font-size:13px;color:var(--text3);margin-top:2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-time{font-size:11px;color:var(--text3)}
.chat-unread{
  width:18px;height:18px;border-radius:50%;background:var(--primary);
  display:flex;align-items:center;justify-content:center;
  font-size:10px;font-weight:700;color:#fff;
}

/* ── SCREEN PAGES ─────────────────────────────────────────────────────────── */
.screen{
  display:none;flex-direction:column;
  height:calc(100svh - 60px - var(--safe-bot));
  overflow:hidden;padding-top:calc(var(--safe-top) + 60px);
}
.screen.active{display:flex}
.screen-title{
  font-size:18px;font-weight:800;color:var(--text);
  padding:12px 16px;border-bottom:1px solid var(--border);
}

/* ── TOAST ────────────────────────────────────────────────────────────────── */
#toast{
  position:fixed;bottom:calc(70px + var(--safe-bot));left:50%;
  transform:translateX(-50%) translateY(20px);
  background:rgba(30,30,30,.95);backdrop-filter:blur(8px);
  color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;
  font-weight:600;z-index:999;opacity:0;transition:all .3s;
  white-space:nowrap;pointer-events:none;border:1px solid rgba(255,255,255,.1);
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── LOADING ──────────────────────────────────────────────────────────────── */
.skeleton{
  background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:8px;
}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.spinner{
  width:32px;height:32px;border:3px solid rgba(255,255,255,.1);
  border-top-color:var(--primary);border-radius:50%;
  animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-center{
  display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:12px;padding:48px;
}
</style>
</head>

<body>
<div id="app">
  <!-- ── HEADER ── -->
  <div id="header">
    <div class="logo">Snap<span>Cht</span></div>
    <div class="tabs" id="feedTabs">
      <button class="tab-btn" onclick="switchFeedTab('following')">Following</button>
      <button class="tab-btn active" onclick="switchFeedTab('foryou')">For You</button>
      <button class="tab-btn" onclick="switchFeedTab('trending')">Trending</button>
    </div>
    <div class="header-right">
      <button class="header-btn" onclick="openPanel('searchPanel')" title="Search">🔍</button>
      <button class="header-btn" onclick="openNotifications()" title="Notifications">
        🔔<div class="notif-dot" id="notifDot"></div>
      </button>
    </div>
  </div>

  <!-- ── FEED PAGE ── -->
  <div id="feedPage" style="flex:1;overflow:hidden;display:flex;flex-direction:column;">
    <div id="feed"></div>
  </div>

  <!-- ── SEARCH SCREEN ── -->
  <div class="screen" id="searchScreen">
    <div class="search-container">
      <div class="search-input-wrap">
        <span class="search-icon">🔍</span>
        <input class="search-input" id="searchInput" placeholder="Search videos, users, #hashtags"
          oninput="onSearch(this.value)"/>
      </div>
      <div class="hashtag-chips" id="hashtagChips"></div>
    </div>
    <div class="search-results" id="searchResults">
      <div class="loading-center"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- ── PROFILE SCREEN ── -->
  <div class="screen" id="profileScreen">
    <div class="profile-header" id="profileHeader">
      <div class="loading-center"><div class="spinner"></div></div>
    </div>
    <div class="profile-tabs" id="profileTabsEl">
      <div class="profile-tab active" data-tab="videos" onclick="switchProfileTab(this)">📹</div>
      <div class="profile-tab" data-tab="liked" onclick="switchProfileTab(this)">❤️</div>
      <div class="profile-tab" data-tab="saved" onclick="switchProfileTab(this)">🔖</div>
    </div>
    <div class="profile-grid" id="profileGrid"></div>
  </div>

  <!-- ── INBOX SCREEN ── -->
  <div class="screen" id="inboxScreen">
    <div class="screen-title">📬 Inbox</div>
    <div class="chat-list" id="chatList">
      <div class="loading-center"><div class="spinner"></div></div>
    </div>
  </div>

  <!-- ── BOTTOM NAV ── -->
  <div id="nav">
    <div class="nav-item active" id="nav-home" onclick="switchPage('home')">
      <div class="nav-icon">🏠</div>
      <div class="nav-label">Home</div>
    </div>
    <div class="nav-item" id="nav-search" onclick="switchPage('search')">
      <div class="nav-icon">🔍</div>
      <div class="nav-label">Search</div>
    </div>
    <div class="nav-item" onclick="openPanel('uploadPanel')">
      <button class="post-btn">＋</button>
      <div class="nav-label" style="color:var(--text3)">Post</div>
    </div>
    <div class="nav-item" id="nav-inbox" onclick="switchPage('inbox')">
      <div class="nav-icon">📬</div>
      <div class="nav-label">Inbox</div>
    </div>
    <div class="nav-item" id="nav-profile" onclick="switchPage('profile')">
      <div class="nav-icon">👤</div>
      <div class="nav-label">Profile</div>
    </div>
  </div>
</div>

<!-- ══════════════════ PANELS ══════════════════ -->

<!-- Comments panel -->
<div class="panel" id="commentsPanel" onclick="closePanelOnBg(event,'commentsPanel')">
  <div class="panel-box">
    <div class="panel-handle"></div>
    <div class="panel-title">💬 Comments <span id="commentCountTitle" style="color:var(--text3);font-size:13px"></span></div>
    <div class="comments-list" id="commentsList"></div>
    <div class="comment-input-row">
      <input class="comment-input" id="commentInput" placeholder="Add a comment..." maxlength="300"/>
      <button class="comment-send" onclick="submitComment()">➤</button>
    </div>
  </div>
</div>

<!-- Share panel -->
<div class="panel" id="sharePanel" onclick="closePanelOnBg(event,'sharePanel')">

// ── Supabase helper ──────────────────────────────────────────────────────────
const sb = {
  headers:{'apikey':SB_ANON_KEY,'Authorization':'Bearer '+SB_ANON_KEY,'Content-Type':'application/json'},
  async get(table,params=''){
    const r=await fetch(`${SB_URL}/rest/v1/${table}?${params}`,{headers:this.headers});
    return r.ok ? r.json() : [];
  },
  async post(table,body){
    const r=await fetch(`${SB_URL}/rest/v1/${table}`,{method:'POST',headers:{...this.headers,'Prefer':'return=representation'},body:JSON.stringify(body)});
    return r.ok ? r.json() : null;
  },
  async patch(table,params,body){
    const r=await fetch(`${SB_URL}/rest/v1/${table}?${params}`,{method:'PATCH',headers:{...this.headers,'Prefer':'return=representation'},body:JSON.stringify(body)});
    return r.ok ? r.json() : null;
  },
  async delete(table,params){
    const r=await fetch(`${SB_URL}/rest/v1/${table}?${params}`,{method:'DELETE',headers:this.headers});
    return r.ok;
  },
  async rpc(fn,params={}){
    const r=await fetch(`${SB_URL}/rest/v1/rpc/${fn}`,{method:'POST',headers:this.headers,body:JSON.stringify(params)});
    return r.ok ? r.json() : null;
  }
};

// ── Auth ─────────────────────────────────────────────────────────────────────
let userId = localStorage.getItem('snapcht_uid') || null;
let username = localStorage.getItem('snapcht_username') || 'user_' + Math.random().toString(36).slice(2,7);
async function ensureAuth(){
  if(userId) return;
  const r = await fetch(`${SB_URL}/auth/v1/signup`,{
    method:'POST',
    headers:{'apikey':SB_ANON_KEY,'Content-Type':'application/json'},

  });
  if(r.ok){
    const d = await r.json();
    userId = d.user?.id;
    if(userId){ localStorage.setItem('snapcht_uid',userId); localStorage.setItem('snapcht_username',username); }

// ── State ─────────────────────────────────────────────────────────────────────
let videos=[], currentTab='foryou', currentPage='home', activePanels=[];
let likedSet=new Set(), savedSet=new Set(), followedSet=new Set();
let activeVideoId=null, lastTap=0, currentMuted=false;
let notifCount=0, profileTab='videos';
let searchTimeout=null;

// ── Toast ─────────────────────────────────────────────────────────────────────
function toast(msg,duration=2000){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),duration);
}

// ── Panel helpers ─────────────────────────────────────────────────────────────
function openPanel(id){ document.getElementById(id).classList.add('show'); activePanels.push(id); }
function closePanel(id){ document.getElementById(id).classList.remove('show'); activePanels=activePanels.filter(p=>p!==id); }
function closePanelOnBg(e,id){ if(e.target.classList.contains('panel')) closePanel(id); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&activePanels.length) closePanel(activePanels[activePanels.length-1]); });

// ── Page switching ─────────────────────────────────────────────────────────────
function switchPage(page){
  currentPage=page;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('feedPage').style.display='none';
  document.getElementById('header').style.display='none';
  const hdr=document.getElementById('header');

  if(page==='home'){
    document.getElementById('feedPage').style.display='flex';
    hdr.style.display='flex';
    document.getElementById('nav-home').classList.add('active');
    pauseAllExcept(null); resumeCurrent();
  } else if(page==='search'){
    document.getElementById('searchScreen').classList.add('active');
    document.getElementById('nav-search').classList.add('active');
    loadSearchScreen();
  } else if(page==='inbox'){
    document.getElementById('inboxScreen').classList.add('active');
    document.getElementById('nav-inbox').classList.add('active');
    loadInbox();
  } else if(page==='profile'){
    document.getElementById('profileScreen').classList.add('active');
    document.getElementById('nav-profile').classList.add('active');
    loadProfile(userId);
  }
}

// ── Feed tabs ──────────────────────────────────────────────────────────────────
function switchFeedTab(tab){
  currentTab=tab;
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active',['following','foryou','trending'][i]===tab);
  });
  document.getElementById('feed').innerHTML='<div class="loading-center"><div class="spinner"></div></div>';
  loadVideos();
}

// ── Load videos ────────────────────────────────────────────────────────────────
async function loadVideos(){
  await ensureAuth();
  let params='select=*&order=created_at.desc&limit=20';
  if(currentTab==='trending') params='select=*&order=likes.desc,views.desc&limit=20';
  else if(currentTab==='following'){
    if(!userId){ document.getElementById('feed').innerHTML=`<div class="loading-center"><div class="empty-icon">👥</div><div class="empty-text">Sign in to see followed creators</div></div>`; return; }
    const followed = await sb.get('followers',`follower_id=eq.${userId}&select=following_id`);
    if(!followed.length){ document.getElementById('feed').innerHTML=`<div class="loading-center"><div class="empty-icon">👥</div><div class="empty-text">Follow some creators first!</div></div>`; return; }
    const ids=followed.map(f=>`"${f.following_id}"`).join(',');
    params=`select=*&user_id=in.(${ids})&order=created_at.desc&limit=20`;
  }
  videos = await sb.get('videos',params);
  if(userId){
    const [lk,sv,fw]=await Promise.all([
      sb.get('liked_videos',`user_id=eq.${userId}&select=video_id`),
      sb.get('saved_videos',`user_id=eq.${userId}&select=video_id`),
      sb.get('followers',`follower_id=eq.${userId}&select=following_id`),
    ]);
    likedSet=new Set(lk.map(l=>l.video_id));
    savedSet=new Set(sv.map(s=>s.video_id));
    followedSet=new Set(fw.map(f=>f.following_id));
  }
  renderFeed();
}

// ── Render feed ────────────────────────────────────────────────────────────────
function renderFeed(){
  const feed=document.getElementById('feed');
  if(!videos.length){
    feed.innerHTML=`<div class="loading-center"><div class="empty-icon">🎥</div><div class="empty-text">No videos yet.<br/>Be the first to post!</div></div>`;
    return;
  }
  feed.innerHTML='';
  videos.forEach(v=>feed.appendChild(buildVideoItem(v)));
  setupObserver();
}

function buildVideoItem(v){
  const el=document.createElement('div');
  el.className='video-item'; el.dataset.id=v.id; el.dataset.userId=v.user_id||'';
  const isLiked=likedSet.has(v.id), isSaved=savedSet.has(v.id);
  const isFollowed=v.user_id&&followedSet.has(v.user_id);
  const isOwn=userId&&v.user_id===userId;
  el.innerHTML=`
    <div class="double-tap-area" ondblclick="handleDoubleTap(event,'${v.id}')"></div>
    <video src="${v.video_url||''}" loop muted playsinline preload="metadata"
      onloadeddata="this.closest('.video-item').querySelector('.progress-fill')&&startProgress(this)"
      onerror="this.poster='';this.parentElement.style.background='#111'"></video>
    <button class="mute-btn" id="mute_${v.id}" onclick="toggleMute(this)">🔇</button>
    <div class="actions">
      <div class="action-btn" onclick="toggleLike('${v.id}')">
        <div class="action-icon ${isLiked?'liked':''}" id="likeIcon_${v.id}">${isLiked?'❤️':'🤍'}</div>
        <div class="action-count" id="likeCount_${v.id}">${fmtNum(v.likes||0)}</div>
      </div>
      <div class="action-btn" onclick="openComments('${v.id}')">
        <div class="action-icon">💬</div>
        <div class="action-count" id="commentCount_${v.id}">${fmtNum(v.comments_count||0)}</div>
      </div>
      <div class="action-btn" onclick="toggleSave('${v.id}')">
        <div class="action-icon ${isSaved?'saved':''}" id="saveIcon_${v.id}">${isSaved?'🔖':'📌'}</div>
        <div class="action-count">${isSaved?'Saved':'Save'}</div>
      </div>
      <div class="action-btn" onclick="openShare('${v.id}','${encodeURIComponent(v.title||'')}')">
        <div class="action-icon">↗️</div>
        <div class="action-count">Share</div>
      </div>
      ${!isOwn?`<div class="action-btn" onclick="openReport('${v.id}')">
        <div class="action-icon">🚩</div>
        <div class="action-count">Report</div>
      </div>`:''}
    </div>
    <div class="video-info">
      <div class="video-username">
        <span class="username-text" onclick="loadProfile('${v.user_id}')">@${v.username||'anonymous'}</span>
        ${!isOwn?`<button class="follow-chip ${isFollowed?'following':''}" id="followBtn_${v.user_id||''}"
          onclick="toggleFollow('${v.user_id||''}','${v.username||''}',this)">
          ${isFollowed?'Following':'Follow'}</button>`:''}
        <span style="font-size:13px;color:rgba(255,255,255,.5)">👁 ${fmtNum(v.views||0)}</span>
      </div>
      ${v.title?`<div class="video-desc" style="font-weight:700">${escHtml(v.title)}</div>`:''}
      ${v.description?`<div class="video-desc">${escHtml(v.description)}</div>`:''}
    </div>
    <div class="progress-bar"><div class="progress-fill" id="prog_${v.id}"></div></div>`;
  return el;
}

// ── Intersection Observer (auto-play) ─────────────────────────────────────────
function setupObserver(){
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      const vid=e.target.querySelector('video');
      if(!vid) return;
      if(e.isIntersecting){
        vid.play().catch(()=>{});
        activeVideoId=e.target.dataset.id;
        trackView(activeVideoId);
        vid.muted=currentMuted;
        const mb=document.getElementById('mute_'+activeVideoId);
        if(mb) mb.textContent=currentMuted?'🔇':'🔊';
      } else {
        vid.pause(); vid.currentTime=0;
        const pf=document.getElementById('prog_'+e.target.dataset.id);
        if(pf) pf.style.width='0%';
      }
    });
  },{threshold:.6});
  document.querySelectorAll('.video-item').forEach(el=>obs.observe(el));
}

function pauseAllExcept(id){ document.querySelectorAll('.video-item video').forEach(v=>{ if(v.closest('.video-item')?.dataset.id!==id) { v.pause(); v.currentTime=0; } }); }
function resumeCurrent(){ const cur=document.querySelector(`.video-item[data-id="${activeVideoId}"] video`); if(cur) cur.play().catch(()=>{}); }

// ── Progress bar ────────────────────────────────────────────────────────────────
function startProgress(vid){
  const id=vid.closest('.video-item')?.dataset.id;
  if(!id) return;
  vid.addEventListener('timeupdate',()=>{
    const pf=document.getElementById('prog_'+id);
    if(pf&&vid.duration) pf.style.width=(vid.currentTime/vid.duration*100)+'%';
  });
}

// ── Mute toggle ──────────────────────────────────────────────────────────────────
function toggleMute(btn){
  currentMuted=!currentMuted;
  btn.textContent=currentMuted?'🔇':'🔊';
  document.querySelectorAll('.video-item video').forEach(v=>v.muted=currentMuted);
  toast(currentMuted?'Muted':'Unmuted');
}

// ── Double-tap like ──────────────────────────────────────────────────────────────
function handleDoubleTap(e,videoId){
  const now=Date.now();
  if(now-lastTap<300){
    const rect=e.currentTarget.getBoundingClientRect();
    showHeartAnim(e.clientX-rect.left,e.clientY-rect.top,e.currentTarget);
    if(!likedSet.has(videoId)) toggleLike(videoId);
  }
  lastTap=now;
}
function showHeartAnim(x,y,container){
  const h=document.createElement('div');
  h.className='heart-anim'; h.textContent='❤️';
  h.style.left=(x-40)+'px'; h.style.top=(y-40)+'px';
  container.appendChild(h);
  setTimeout(()=>h.remove(),900);
}

// ── Like ──────────────────────────────────────────────────────────────────────
async function toggleLike(videoId){
  await ensureAuth();
  const icon=document.getElementById('likeIcon_'+videoId);
  const countEl=document.getElementById('likeCount_'+videoId);
  const vid=videos.find(v=>v.id===videoId);
  if(!vid) return;
  if(likedSet.has(videoId)){
    likedSet.delete(videoId);
    icon.textContent='🤍'; icon.classList.remove('liked');
    vid.likes=Math.max(0,(vid.likes||1)-1);
    countEl.textContent=fmtNum(vid.likes);
    await Promise.all([
      sb.delete('liked_videos',`user_id=eq.${userId}&video_id=eq.${videoId}`),
      sb.patch('videos',`id=eq.${videoId}`,{likes:vid.likes})
    ]);
  } else {
    likedSet.add(videoId);
    icon.textContent='❤️'; icon.classList.add('liked');
    vid.likes=(vid.likes||0)+1;
    countEl.textContent=fmtNum(vid.likes);
    icon.animate([{transform:'scale(1)'},{transform:'scale(1.4)'},{transform:'scale(1)'}],{duration:300});
    await Promise.all([
      sb.post('liked_videos',{user_id:userId,video_id:videoId}),
      sb.patch('videos',`id=eq.${videoId}`,{likes:vid.likes})
    ]);
    // Send notification to video owner
    if(vid.user_id&&vid.user_id!==userId){
      sb.post('notifications',{user_id:vid.user_id,from_user_id:userId,from_username:username,
        type:'like',video_id:videoId,message:`@${username} liked your video`});
    }
  }
}

// ── Save ──────────────────────────────────────────────────────────────────────
async function toggleSave(videoId){
  await ensureAuth();
  const icon=document.getElementById('saveIcon_'+videoId);
  if(savedSet.has(videoId)){
    savedSet.delete(videoId);
    icon.textContent='📌'; icon.classList.remove('saved');
    await sb.delete('saved_videos',`user_id=eq.${userId}&video_id=eq.${videoId}`);
    toast('Removed from saved');
  } else {
    savedSet.add(videoId);
    icon.textContent='🔖'; icon.classList.add('saved');
    await sb.post('saved_videos',{user_id:userId,video_id:videoId});
    toast('Saved! ✓');
  }
}

// ── Follow ────────────────────────────────────────────────────────────────────
async function toggleFollow(targetId,targetUsername,btn){
  if(!targetId) return;
  await ensureAuth();
  if(followedSet.has(targetId)){
    followedSet.delete(targetId);
    btn.textContent='Follow'; btn.classList.remove('following');
    await sb.delete('followers',`follower_id=eq.${userId}&following_id=eq.${targetId}`);
    toast('Unfollowed');
  } else {
    followedSet.add(targetId);
    btn.textContent='Following'; btn.classList.add('following');
    await sb.post('followers',{follower_id:userId,following_id:targetId});
    toast(`Following @${targetUsername} ✓`);
    // Notification
    sb.post('notifications',{user_id:targetId,from_user_id:userId,from_username:username,
      type:'follow',message:`@${username} started following you`});
  }
}

// ── View tracking ──────────────────────────────────────────────────────────────
const viewedSet=new Set();
async function trackView(videoId){
  if(!videoId||viewedSet.has(videoId)) return;
  viewedSet.add(videoId);
  const vid=videos.find(v=>v.id===videoId);
  if(vid){ vid.views=(vid.views||0)+1; await sb.patch('videos',`id=eq.${videoId}`,{views:vid.views}); }
}

// ── Comments ───────────────────────────────────────────────────────────────────
let activeCommentVideoId=null;
async function openComments(videoId){
  activeCommentVideoId=videoId;
  const vid=videos.find(v=>v.id===videoId);
  const countEl=document.getElementById('commentCountTitle');
  if(countEl) countEl.textContent=`(${vid?.comments_count||0})`;
  openPanel('commentsPanel');
  const list=document.getElementById('commentsList');
  list.innerHTML='<div class="loading-center"><div class="spinner"></div></div>';
  const comments=await sb.get('comments',`video_id=eq.${videoId}&order=created_at.desc&limit=50`);
  if(!comments.length){
    list.innerHTML='<div class="empty-state"><div class="empty-icon">💬</div><div class="empty-text">No comments yet.<br/>Be the first!</div></div>';
    return;
  }
  list.innerHTML=comments.map(c=>`
    <div class="comment-item">
      <div class="comment-avatar">${c.username?c.username[0].toUpperCase():'👤'}</div>
      <div class="comment-body">
        <div class="comment-user">@${escHtml(c.username||'anonymous')}</div>
        <div class="comment-text">${escHtml(c.comment_text)}</div>
        <div class="comment-time">${timeAgo(c.created_at)}</div>
      </div>
    </div>`).join('');
}

async function submitComment(){
  const input=document.getElementById('commentInput');
  const text=input.value.trim();
  if(!text) return;
  await ensureAuth();
  input.value='';
  const vid=videos.find(v=>v.id===activeCommentVideoId);
  const result=await sb.post('comments',{video_id:activeCommentVideoId,user_id:userId,username,comment_text:text});
  if(result){
    if(vid){ vid.comments_count=(vid.comments_count||0)+1; const el=document.getElementById('commentCount_'+activeCommentVideoId); if(el) el.textContent=fmtNum(vid.comments_count); }
    await openComments(activeCommentVideoId);
    toast('Comment posted ✓');
    // Notification to video owner
    if(vid?.user_id&&vid.user_id!==userId){
      sb.post('notifications',{user_id:vid.user_id,from_user_id:userId,from_username:username,
        type:'comment',video_id:activeCommentVideoId,message:`@${username} commented: "${text.slice(0,40)}"`});
    }
  }
}
document.getElementById('commentInput').addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitComment();} });

// ── Share ──────────────────────────────────────────────────────────────────────
let shareUrl='',shareTitle='';
function openShare(videoId,title){
  shareUrl=`${window.location.href}?v=${videoId}`;
  shareTitle=decodeURIComponent(title)||'Check this video on SnapCht!';
  openPanel('sharePanel');
}
async function nativeShare(){
  if(navigator.share){
    try{ await navigator.share({title:shareTitle,url:shareUrl}); closePanel('sharePanel'); return; }catch{}
  }
  copyLink();
}
function copyLink(){ navigator.clipboard.writeText(shareUrl).then(()=>{ toast('Link copied! 🔗'); closePanel('sharePanel'); }).catch(()=>toast('Could not copy')); }
function shareToWhatsApp(){ window.open(`https://wa.me/?text=${encodeURIComponent(shareTitle+' '+shareUrl)}`,'_blank'); closePanel('sharePanel'); }
function shareToTelegram(){ window.open(`https://t.me/share/url?url=${encodeURIComponent(shareUrl)}&text=${encodeURIComponent(shareTitle)}`,'_blank'); closePanel('sharePanel'); }

// ── Report ─────────────────────────────────────────────────────────────────────
let reportVideoId=null;
function openReport(videoId){ reportVideoId=videoId; openPanel('reportPanel'); }
async function submitReport(){
  if(!reportVideoId) return;
  await ensureAuth();
  await sb.post('reports',{video_id:reportVideoId,user_id:userId,reason:'User reported content'});
  closePanel('reportPanel'); toast('Reported. Thank you. 🚩');
  reportVideoId=null;
}

// ── Upload ─────────────────────────────────────────────────────────────────────
let urlPreviewTimeout=null;
function previewUrl(){
  clearTimeout(urlPreviewTimeout);
  urlPreviewTimeout=setTimeout(()=>{
    const url=document.getElementById('videoUrl').value.trim();
    const preview=document.getElementById('urlPreview');
    const vid=document.getElementById('previewVid');
    if(url){
      vid.src=url; preview.style.display='block';
      vid.load(); vid.play().catch(()=>{});
    } else {
      preview.style.display='none';
    }
  },800);
}

async function uploadVideo(){
  const url=document.getElementById('videoUrl').value.trim();
  const title=document.getElementById('videoTitle').value.trim();
  const desc=document.getElementById('videoDesc').value.trim();
  if(!url){ toast('Please enter a video URL'); return; }
  await ensureAuth();
  const btn=document.getElementById('submitBtn');
  btn.disabled=true; btn.innerHTML='<div class="spinner" style="width:20px;height:20px"></div> Posting...';
  const result=await sb.post('videos',{video_url:url,title:title||null,description:desc||null,user_id:userId,username,likes:0,views:0,comments_count:0});
  btn.disabled=false; btn.innerHTML='<span>Post Now</span>';
  if(result){
    document.getElementById('videoUrl').value='';
    document.getElementById('videoTitle').value='';
    document.getElementById('videoDesc').value='';
    document.getElementById('urlPreview').style.display='none';
    closePanel('uploadPanel');
    toast('Posted! 🎉');
    switchFeedTab('foryou');
  } else {
    toast('Failed to post. Try again.');
  }
}

// ── Notifications ──────────────────────────────────────────────────────────────
async function openNotifications(){
  openPanel('notifPanel');
  document.getElementById('notifDot').classList.remove('show');
  const list=document.getElementById('notifList');
  list.innerHTML='<div class="loading-center"><div class="spinner"></div></div>';
  if(!userId){ list.innerHTML='<div class="empty-state"><div class="empty-icon">🔔</div><div class="empty-text">Sign in to see notifications</div></div>'; return; }
  const notifs=await sb.get('notifications',`user_id=eq.${userId}&order=created_at.desc&limit=30`);
  // Mark all as read
  await sb.patch('notifications',`user_id=eq.${userId}&read=eq.false`,{read:true});
  notifCount=0;
  if(!notifs.length){
    list.innerHTML='<div class="empty-state"><div class="empty-icon">🔔</div><div class="empty-text">No notifications yet</div></div>';
    return;
  }
  const icons={like:'❤️',comment:'💬',follow:'👤',mention:'@',default:'🔔'};
  list.innerHTML=notifs.map(n=>`
    <div class="notif-item ${n.read?'':'unread'}">
      <div class="notif-avatar">${icons[n.type]||icons.default}</div>
      <div class="notif-text"><strong>@${escHtml(n.from_username||'Someone')}</strong> ${escHtml(n.message||'')}</div>
      <div class="notif-time">${timeAgo(n.created_at)}</div>
    </div>`).join('');
}

async function checkNotifications(){
  if(!userId) return;
  const notifs=await sb.get('notifications',`user_id=eq.${userId}&read=eq.false&select=id`);
  notifCount=notifs.length;
  document.getElementById('notifDot').classList.toggle('show',notifCount>0);
}

// ── Profile ────────────────────────────────────────────────────────────────────
async function loadProfile(uid){
  if(!uid) uid=userId;
  if(!uid) return;
  switchPage('profile');
  const header=document.getElementById('profileHeader');
  header.innerHTML='<div class="loading-center"><div class="spinner"></div></div>';

  const [userVids,stats]=await Promise.all([
    sb.get('videos',`user_id=eq.${uid}&order=created_at.desc&limit=30`),
    sb.rpc('get_user_stats',{user_id_param:uid}).catch(()=>null),
  ]);
  const isOwn=uid===userId;
  const isFollowing=followedSet.has(uid);
  const uname=userVids[0]?.username||'User';
  const totalLikes=stats?.total_likes||0;
  const followers=stats?.total_followers||0;
  const following=stats?.total_following||0;

  header.innerHTML=`
    <div class="profile-avatar">${uname[0]?.toUpperCase()||'👤'}</div>
    <div class="profile-name">@${escHtml(uname)}</div>
    <div class="profile-stats">
      <div class="stat-item"><div class="stat-num">${fmtNum(userVids.length)}</div><div class="stat-label">Videos</div></div>
      <div class="stat-item"><div class="stat-num">${fmtNum(totalLikes)}</div><div class="stat-label">Likes</div></div>
      <div class="stat-item"><div class="stat-num">${fmtNum(followers)}</div><div class="stat-label">Followers</div></div>
      <div class="stat-item"><div class="stat-num">${fmtNum(following)}</div><div class="stat-label">Following</div></div>
    </div>
    ${isOwn
      ? `<button class="profile-edit-btn" onclick="toast('Edit profile coming soon!')">✏️ Edit Profile</button>`
      : `<button class="profile-edit-btn ${isFollowing?'':''}"\
          style="${isFollowing?'background:var(--surface2)':'background:var(--primary);border-color:var(--primary);color:#fff'}"\
          onclick="toggleFollow('${uid}','${escHtml(uname)}',this)">\
          ${isFollowing?'Following':'Follow'}</button>`
    }`;

  window._profileVids=userVids; window._profileUid=uid;
  switchProfileTab(document.querySelector('.profile-tab[data-tab="videos"]'),uid);
}

async function switchProfileTab(tabEl,uid){
  if(!uid) uid=window._profileUid||userId;
  document.querySelectorAll('.profile-tab').forEach(t=>t.classList.remove('active'));
  tabEl.classList.add('active');
  const tab=tabEl.dataset.tab;
  const grid=document.getElementById('profileGrid');
  grid.innerHTML='';
  let vids=[];
  if(tab==='videos') vids=window._profileVids||[];
  else if(tab==='liked') vids=await sb.get('liked_videos',`user_id=eq.${uid}&select=videos(*)&limit=30`).then(r=>r.map(i=>i.videos).filter(Boolean));
  else if(tab==='saved') vids=await sb.get('saved_videos',`user_id=eq.${uid}&select=videos(*)&limit=30`).then(r=>r.map(i=>i.videos).filter(Boolean));
  if(!vids.length){
    grid.innerHTML='<div style="grid-column:1/-1;padding:32px;text-align:center;color:var(--text3);font-size:13px">No videos</div>';
    return;
  }
  vids.forEach(v=>{
    const d=document.createElement('div');
    d.className='profile-thumb';
    d.innerHTML=`<video src="${v.video_url||''}" muted preload="metadata" style="pointer-events:none"></video>
      <div class="thumb-likes">❤️ ${fmtNum(v.likes||0)}</div>`;
    d.onclick=()=>{ closeAllAndJumpTo(v.id); };
    grid.appendChild(d);
  });
}

function closeAllAndJumpTo(videoId){
  switchPage('home');
  setTimeout(()=>{
    const el=document.querySelector(`.video-item[data-id="${videoId}"]`);
    if(el) el.scrollIntoView({behavior:'smooth'});
  },100);
}

// ── Search ─────────────────────────────────────────────────────────────────────
const TRENDING_TAGS=['#fyp','#viral','#malaysia','#trending','#funny','#travel','#music','#food'];
function loadSearchScreen(){
  const chips=document.getElementById('hashtagChips');
  chips.innerHTML=TRENDING_TAGS.map(t=>`<div class="hashtag-chip" onclick="quickSearch('${t}')">${t}</div>`).join('');
  renderSearchResults(videos);
}
function quickSearch(tag){ const inp=document.getElementById('searchInput'); inp.value=tag; onSearch(tag); }
function onSearch(q){
  clearTimeout(searchTimeout);
  searchTimeout=setTimeout(()=>{
    const filtered=videos.filter(v=>
      (v.title||'').toLowerCase().includes(q.toLowerCase())||
      (v.description||'').toLowerCase().includes(q.toLowerCase())||
      (v.username||'').toLowerCase().includes(q.toLowerCase())
    );
    renderSearchResults(filtered,q);
  },300);
}
function renderSearchResults(vids,q=''){
  const container=document.getElementById('searchResults');
  if(!vids.length){
    container.innerHTML=`<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">No results for "${escHtml(q)}"</div></div>`;
    return;
  }
  container.innerHTML=vids.map(v=>`
    <div class="search-video-item" onclick="closeAllAndJumpTo('${v.id}')">
      <video class="search-thumb" src="${v.video_url}" muted preload="metadata"></video>
      <div class="search-info">
        <div class="search-title">${escHtml(v.title||v.description||'No title')}</div>
        <div class="search-meta">@${escHtml(v.username||'anonymous')} · ❤️ ${fmtNum(v.likes||0)} · 👁 ${fmtNum(v.views||0)}</div>
      </div>
    </div>`).join('');
}

// Panel search
function onPanelSearch(q){
  clearTimeout(searchTimeout);
  searchTimeout=setTimeout(async()=>{
    const res=document.getElementById('searchPanelResults');
    if(!q){ res.innerHTML=`<div class="hashtag-chips">${TRENDING_TAGS.map(t=>`<div class="hashtag-chip" onclick="quickSearch('${t}')">${t}</div>`).join('')}</div>`; return; }
    const results=await sb.get('videos',`select=*&or=(title.ilike.*${q}*,description.ilike.*${q}*,username.ilike.*${q}*)&limit=10`);
    if(!results.length){ res.innerHTML=`<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-text">No results</div></div>`; return; }
    res.innerHTML=results.map(v=>`
      <div class="search-video-item" onclick="closeAllAndJumpTo('${v.id}');closePanel('searchPanel')">
        <video class="search-thumb" src="${v.video_url}" muted preload="metadata"></video>
        <div class="search-info">
          <div class="search-title">${escHtml(v.title||v.description||'No title')}</div>
          <div class="search-meta">@${escHtml(v.username||'anonymous')} · ❤️ ${fmtNum(v.likes||0)}</div>
        </div>
      </div>`).join('');
  },400);
}

// ── Inbox/Chat ─────────────────────────────────────────────────────────────────
async function loadInbox(){
  const list=document.getElementById('chatList');
  if(!userId){ list.innerHTML='<div class="empty-state"><div class="empty-icon">📬</div><div class="empty-text">Sign in to see messages</div></div>'; return; }
  const msgs=await sb.get('messages',`or=(from_user.eq.${userId},to_user.eq.${userId})&order=created_at.desc&limit=50`);
  const seen=new Map();
  msgs.forEach(m=>{
    const other=m.from_user===userId?m.to_user:m.from_user;
    if(!seen.has(other)) seen.set(other,m);
  });
  const convos=[...seen.values()];
  if(!convos.length){ list.innerHTML='<div class="empty-state"><div class="empty-icon">📬</div><div class="empty-text">No messages yet</div></div>'; return; }
  list.innerHTML=convos.map(m=>{
    const other=m.from_user===userId?m.to_user:m.from_user;
    const unread=!m.read&&m.to_user===userId;
    return `<div class="chat-item">
      <div class="chat-avatar">${(other||'?')[0]?.toUpperCase()||'👤'}</div>
      <div class="chat-info">
        <div class="chat-name">${escHtml(other?.slice(0,8)||'Unknown')}</div>
        <div class="chat-preview">${escHtml(m.message||'')}</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:4px">
        <div class="chat-time">${timeAgo(m.created_at)}</div>
        ${unread?'<div class="chat-unread">1</div>':''}
      </div>
    </div>`;
  }).join('');
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function fmtNum(n){
  if(n>=1000000) return (n/1000000).toFixed(1)+'M';
  if(n>=1000) return (n/1000).toFixed(1)+'K';
  return String(n||0);
}
function escHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function timeAgo(ts){
  if(!ts) return '';
  const sec=Math.floor((Date.now()-new Date(ts).getTime())/1000);
  if(sec<60) return sec+'s';
  if(sec<3600) return Math.floor(sec/60)+'m';
  if(sec<86400) return Math.floor(sec/3600)+'h';
  return Math.floor(sec/86400)+'d';
}

// ── Pull to refresh ────────────────────────────────────────────────────────────
let pullStart=0;
document.getElementById('feed').addEventListener('touchstart',e=>{ if(e.touches[0].clientY<80) pullStart=e.touches[0].clientY; });
document.getElementById('feed').addEventListener('touchend',e=>{
  if(pullStart>0&&e.changedTouches[0].clientY-pullStart>80&&document.getElementById('feed').scrollTop===0){
    pullStart=0; toast('Refreshing...'); loadVideos();
  }
  pullStart=0;
});

// ── Init ──────────────────────────────────────────────────────────────────────
(async function init(){
  await loadVideos();
  // Check notifications after a short delay
  setTimeout(async()=>{
    await ensureAuth();
    checkNotifications();
    setInterval(checkNotifications,60000); // Poll every minute
  },2000);
})();
</script>
