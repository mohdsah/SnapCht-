<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>SnapCht · Video Pendek</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="loading-screen" id="loadingScreen">
    <div class="loading-spinner"></div>
    <p>Memuatkan SnapCht...</p>
</div>

<div class="pull-to-refresh" id="pullToRefresh"><span>↓ Tarik ke bawah untuk refresh</span></div>

<header class="app-header">
    <div class="header-left"><a href="#" class="brand-logo">Snap<span>Cht</span></a></div>
    <div class="header-center">
        <div class="top-tabs">
            <div class="top-tab active" data-tab="foryou">For You</div>
            <div class="top-tab" data-tab="trending">Trending</div>
        </div>
    </div>
    <div class="search-container">
        <span>🔍</span>
        <input type="text" id="globalSearchInput" placeholder="Cari video atau #hashtag...">
    </div>
    <div class="header-right" id="themeBtn">🌙</div>
    <div class="header-right" id="notifBtn">🔔</div>
</header>

<div class="main-wrapper">
    <aside class="sidebar-left">
        <div class="menu-section">
            <div class="menu-item active" data-nav="home"><span class="menu-icon">🏠</span> For You</div>
            <div class="menu-item" data-nav="trending"><span class="menu-icon">🔥</span> Trending</div>
            <div class="menu-item" data-nav="myvideos"><span class="menu-icon">📹</span> My Videos</div>
            <div class="menu-item" data-nav="saved"><span class="menu-icon">📌</span> Saved Videos</div>
        </div>
        <div class="menu-section">
            <div class="menu-title">Social</div>
            <div class="menu-item" data-nav="chat"><span class="menu-icon">💬</span> Chat</div>
        </div>
        <div class="menu-section">
            <div class="menu-title">Suggested accounts</div>
            <div id="suggestedAccounts"></div>
        </div>
        <div class="menu-section">
            <div class="theme-toggle" id="sidebarThemeToggle"><span>☀️ Tukar ke Light Mode</span></div>
        </div>
        <div class="menu-section">
            <div class="menu-title">SnapCht Resources</div>
            <div class="footer-links"><a>About</a> <a>Newsroom</a> <a>Contact</a> <a>Privacy</a> <a>Terms</a></div>
            <div style="color:#555;font-size:0.7rem;margin-top:10px;">© 2026 SnapCht</div>
        </div>
    </aside>

    <main class="content-center">
        <div class="feed-container" id="videoFeed"></div>
    </main>
</div>

<nav class="mobile-nav-bar">
    <div class="nav-item-box active" data-mnav="home"><span class="nav-icon">🏠</span><span class="nav-label">Home</span></div>
    <div class="nav-item-box" data-mnav="trending"><span class="nav-icon">🔥</span><span class="nav-label">Trending</span></div>
    <div class="nav-item-box" data-mnav="create"><div class="create-btn-wrapper">+</div></div>
    <div class="nav-item-box" data-mnav="chat"><span class="nav-icon">💬</span><span class="nav-label">Chat</span></div>
    <div class="nav-item-box" data-mnav="profile"><span class="nav-icon">👤</span><span class="nav-label">Profile</span></div>
</nav>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/videos.js"></script>
<script src="js/comments.js"></script>
<script src="js/chat.js"></script>
<script src="js/profile.js"></script>
<script src="js/upload.js"></script>
<script src="js/app.js"></script>
</body>
</html>
