<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Muat Naik · SnapCht</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
    <link rel="stylesheet" href="css/upload.css?v=14">
<style>
.seg { display:flex; gap:8px; margin-bottom:16px; }
.seg button { flex:1; min-height:60px; padding:10px 6px; border:1.5px solid var(--line); background:var(--bg); color:var(--ink); border-radius:16px; font-weight:700; font-size:.9rem; cursor:pointer; line-height:1.3; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.seg button.active { background:var(--primary); color:#fff; border-color:var(--primary); }
.seg button:disabled { opacity:.45; cursor:not-allowed; }
.drop { display:flex; align-items:center; justify-content:center; min-height:170px; border:2px dashed var(--primary2); border-radius:20px; padding:24px 14px; text-align:center; color:var(--muted); cursor:pointer; margin-bottom:14px; background:var(--bg); line-height:1.6; }
.drop.over { border-color:var(--primary); background:var(--surface); }
.prev { width:100%; max-height:320px; border-radius:14px; background:#000; margin-bottom:12px; }
.counter { text-align:right; font-size:.75rem; color:var(--muted); margin:-6px 4px 12px; }
.prog-row { display:flex; justify-content:space-between; align-items:center; font-size:.85rem; margin:6px 2px 10px; }
.link-btn { background:none; border:none; color:var(--danger); cursor:pointer; font-weight:700; min-height:44px; padding:0 12px; font-size:.9rem; }
#go { min-height:54px; font-size:1.05rem; margin-top:4px; }
</style>
</head>
<body>
<header class="app-header">
    <a class="header-right" href="index.html" aria-label="Kembali">←</a>
    <a href="index.html" class="brand-logo">Snap<span>Cht</span></a>
    <div class="header-spacer"></div>
    <div class="header-right" id="themeBtn">🌙</div>
</header>
<main class="sub-main">
<div class="upload-wrap" id="uploadRoot"><div class="empty-state">Memuatkan...</div></div>
</main>
<script src="js/upload.js?v=14"></script>
</body>
</html>
