<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Daftar · SnapCht</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
<header class="app-header">
    <a class="header-right" href="index.html" aria-label="Kembali">←</a>
    <a href="index.html" class="brand-logo">Snap<span>Cht</span></a>
    <div class="header-spacer"></div>
    <div class="header-right" id="themeBtn">🌙</div>
</header>
<main class="sub-main">
<div class="auth-card" style="margin:20px auto;">
    <h3 style="margin-bottom:18px;">Daftar Akaun</h3>
    <form id="authForm" novalidate>
        <input class="modal-input" id="username" placeholder="Nama pengguna (3-20: a-z, 0-9, _)" maxlength="20" autocomplete="username">
        <input class="modal-input" id="email" type="email" placeholder="Email" autocomplete="email">
        <input class="modal-input" id="pass" type="password" placeholder="Kata laluan (min 8 aksara)" autocomplete="new-password">
        <input class="modal-input" id="pass2" type="password" placeholder="Sahkan kata laluan" autocomplete="new-password">
        <button class="btn-primary" id="submitBtn" type="submit">Daftar</button></form>
    <p class="auth-msg" id="authMsg"></p>
    <div class="auth-links"><a href="login.html">Sudah ada akaun? Log masuk</a><a href="index.html" style="color:var(--muted)">Terus menonton tanpa akaun</a></div>
</div>
</main>
<script src="js/register.js"></script>
</body>
</html>
